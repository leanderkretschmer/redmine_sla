  text_sla_embed_help: >-
    This URL shows the overview without Redmine menu and search bar and can be embedded into other panels.
    The key is your personal read-only feed key (as used for Atom feeds); it can be reset under "My account".
    Only projects you are allowed to see are shown.
  text_sla_embed_params: 'Optional parameters: project_id=<identifier> (single project), refresh=<seconds> (auto reload, minimum 30).'

  label_sla_resize_hint: Drag the bottom-right corner to resize (remembered in this browser). Drag the block to the top area for full width.

