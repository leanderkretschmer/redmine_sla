  text_sla_projects_help: >-
    Nur Projekte mit einem Eintrag in dieser Liste haben ein SLA. Für sie werden Antwortfristen erzeugt,
    sobald eine externe Person (nicht im Human-Resources-Plugin als Mitarbeiter hinterlegt) ein Ticket anlegt
    oder kommentiert – per Weboberfläche, E-Mail oder TYPO3-Anbindung. Eine öffentliche Antwort eines
    Mitarbeiters oder das Schließen des Tickets erledigt die Frist.
  text_sla_holidays_help: >-
    Feiertage zählen nicht als Arbeitszeit. Ohne Projekt gilt der Feiertag für alle Projekte.
  text_sla_rules_help: >-
    Sonderregeln überschreiben die Reaktionsfrist eines Projekt-SLAs für bestimmte Tracker.
    Bei mehreren passenden Regeln gewinnt die höchste Priorität.
  text_sla_response_time_info: Arbeitsminuten innerhalb der Geschäftszeiten bis zur ersten Antwort.
  text_sla_puffer_info: Die interne Frist liegt spätestens so viele Minuten vor Arbeitsende des Fristtags.
  text_sla_time_zone_info: 'Zeitzone: %{zone} (änderbar in den Plugin-Einstellungen).'
  text_sla_time_zone_setting_info: Zeitzone, in der Arbeitsbeginn und -ende interpretiert werden.
  text_sla_plugin_settings_help: >-
