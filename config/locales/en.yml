  text_sla_projects_help: >-
    Only projects listed here have an SLA. For them, response deadlines are created whenever an external
    person (not registered as an employee in the Human Resources plugin) creates or comments on a ticket –
    via web, e-mail or the TYPO3 integration. A public reply by an employee or closing the ticket clears the deadline.
  text_sla_holidays_help: Holidays do not count as business time. Without a project the holiday applies to all projects.
  text_sla_rules_help: >-
    Special rules override a project SLA's response time for specific trackers.
    If several rules match, the highest priority wins.
  text_sla_response_time_info: Business minutes within business hours until the first reply.
  text_sla_puffer_info: The internal deadline is at the latest this many minutes before end of business on the due day.
  text_sla_time_zone_info: 'Time zone: %{zone} (configurable in the plugin settings).'
  text_sla_time_zone_setting_info: Time zone used to interpret start and end of business.
  text_sla_plugin_settings_help: These values pre-fill new project SLAs. Project SLAs are managed under
  text_sla_rule_project_info: Only projects with a project SLA; leave empty to apply the rule in all SLA projects.
  text_sla_rule_priority_info: Higher number wins when several rules match.
  text_sla_confirm_delete_setting: Delete project SLA? All open response deadlines of this project will be removed.
