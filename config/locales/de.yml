  text_sla_internal_users_help: >-
    Als intern gelten die im Human-Resources-Plugin hinterlegten Mitarbeiter (Anstellungsart oder Eintrittsdatum
    gesetzt, Zeit- oder Abwesenheitsbuchungen vorhanden). Nur Beiträge interner Nutzer erledigen eine Antwortfrist;
    alle anderen Beiträge (E-Mail-Absender, TYPO3, API-Nutzer) lösen eine aus. Ist das HR-Plugin nicht installiert,
    gelten alle aktiven Benutzerkonten als intern.

