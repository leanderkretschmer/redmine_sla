  text_sla_internal_users_help: >-
    Internal users are the employees registered in the Human Resources plugin (employment type or start date set,
    time or absence entries present). Only posts by internal users clear a response deadline; all other posts
    (e-mail senders, TYPO3, API users) create one. Without the HR plugin all active accounts count as internal.

