  button_sla_rebuild: Rebuild deadlines
  notice_sla_excluded: Excluded from SLA tracking.
  notice_sla_rebuilt: Open response deadlines have been rebuilt from the ticket history.
  error_sla_request_failed: The request failed.
  text_sla_exclusions_help: >-
    Triggers (ticket creation or a single external comment) that deliberately create no deadline – e.g. a
    customer's "thanks, ok". Exceptions are set from the popup of an SLA entry and can be removed here.
  text_sla_exclude_comment_confirm: Ignore this comment as a trigger? The deadline is dropped; a later external comment will create a new one.
  text_sla_exclude_ticket_confirm: Ignore the creation of this ticket as a trigger? Later external comments still create deadlines.
  text_sla_exclude_info: For comments like "thanks" or "ok" that need no reply.
  text_sla_excluded_statuses_help: >-
    Tickets in these statuses count as done: open deadlines are closed and new comments on such tickets
    create no deadline. Without a selection all statuses marked as "closed" apply.
  text_sla_excluded_statuses_rebuild: 'After a change, re-evaluate existing deadlines:'
  text_sla_rebuild_confirm: Rebuild all open response deadlines from the ticket history?
  text_sla_rebuild_info: Re-evaluates all open tickets of SLA projects (after changing status rules, holidays or employees).

  button_sla_exclude: Remove from SLA

  button_sla_mine: Assigned to me
  text_sla_mine_hint: Show only entries whose ticket is assigned to me

  notice_sla_rule_created: Special rule has been created.
  notice_sla_rule_updated: Special rule has been updated.
  notice_sla_rule_deleted: Special rule has been deleted.

  text_sla_projects_help: >-
    Only projects listed here have an SLA. For them, response deadlines are created whenever an external
    person (not registered as an employee in the Human Resources plugin) creates or comments on a ticket –
    via web, e-mail or the TYPO3 integration. A public reply by an employee or closing the ticket clears the deadline.
  text_sla_holidays_help: Holidays do not count as business time. Without a project the holiday applies to all projects.
  text_sla_rules_help: >-
    Special rules override a project SLA's times for specific trackers (initial response and/or comment response time).
    If several rules match, the highest priority wins.
  text_sla_initial_response_time_info: Business minutes within business hours until a newly created ticket (e.g. from the helpdesk) needs a first reply.
  text_sla_response_time_info: Business minutes within business hours until an external comment on an existing ticket must be answered.
  text_sla_rule_times_info: Leave empty to use the project SLA value; at least one of the two times is required.
  text_sla_puffer_info: The internal deadline is at the latest this many minutes before end of business on the due day.
  text_sla_time_zone_info: 'Time zone: %{zone} (configurable in the plugin settings).'
  text_sla_time_zone_setting_info: Time zone used to interpret start and end of business.
  text_sla_plugin_settings_help: These values pre-fill new project SLAs. Project SLAs are managed under
  text_sla_rule_project_info: Only projects with a project SLA; leave empty to apply the rule in all SLA projects.
  text_sla_rule_priority_info: Higher number wins when several rules match.
  text_sla_confirm_delete_setting: Delete project SLA? All open response deadlines of this project will be removed.
