  label_sla_embed: Einbetten
  label_sla_embed_url: Einbett-Adresse (ohne Redmine-Rahmen)
  label_sla_embed_html: HTML-Schnipsel (iframe)
  label_sla_embed_updated: 'Stand: %{time}'
  text_sla_embed_help: >-
    Diese Adresse zeigt die Übersicht ohne Redmine-Menü und Suchleiste und kann in andere Panels eingebettet werden.
    Der enthaltene Schlüssel ist dein persönlicher, nur lesender Feed-Schlüssel (wie bei Atom-Feeds); er kann unter
    "Mein Konto" zurückgesetzt werden. Gezeigt werden die Projekte, die du sehen darfst.
  text_sla_embed_params: 'Optionale Parameter: project_id=<Projektkennung> (nur ein Projekt), refresh=<Sekunden> (automatisch neu laden, mindestens 30).'

  label_sla_resize_hint: Größe über die rechte untere Ecke ändern (wird im Browser gemerkt). Für volle Breite den Block in den oberen Bereich ziehen.

  notice_sla_rule_created: Sonderregel wurde erstellt.
  notice_sla_rule_updated: Sonderregel wurde aktualisiert.
  notice_sla_rule_deleted: Sonderregel wurde gelöscht.

  text_sla_projects_help: >-
    Nur Projekte mit einem Eintrag in dieser Liste haben ein SLA. Für sie werden Antwortfristen erzeugt,
    sobald eine externe Person (nicht im Human-Resources-Plugin als Mitarbeiter hinterlegt) ein Ticket anlegt
    oder kommentiert – per Weboberfläche, E-Mail oder TYPO3-Anbindung. Eine öffentliche Antwort eines
    Mitarbeiters oder das Schließen des Tickets erledigt die Frist.
  text_sla_holidays_help: >-
    Feiertage zählen nicht als Arbeitszeit. Ohne Projekt gilt der Feiertag für alle Projekte.
  text_sla_rules_help: >-
    Sonderregeln überschreiben die Fristen eines Projekt-SLAs für bestimmte Tracker (Reaktionszeit neues Ticket und/oder Antwortzeit auf Kommentare).
    Bei mehreren passenden Regeln gewinnt die höchste Priorität.
  text_sla_initial_response_time_info: Arbeitsminuten innerhalb der Geschäftszeiten, bis ein neu eingegangenes Ticket (z. B. aus dem Helpdesk) eine erste Antwort braucht.
  text_sla_response_time_info: Arbeitsminuten innerhalb der Geschäftszeiten, bis ein Kommentar eines Externen auf einem bestehenden Ticket beantwortet sein muss.
  text_sla_rule_times_info: Leer lassen, um den Wert des Projekt-SLAs zu übernehmen; mindestens eine der beiden Fristen angeben.
  text_sla_puffer_info: Die interne Frist liegt spätestens so viele Minuten vor Arbeitsende des Fristtags.
  text_sla_time_zone_info: 'Zeitzone: %{zone} (änderbar in den Plugin-Einstellungen).'
  text_sla_time_zone_setting_info: Zeitzone, in der Arbeitsbeginn und -ende interpretiert werden.
  text_sla_plugin_settings_help: >-
    Diese Werte dienen als Vorbelegung für neue Projekt-SLAs. Die SLAs der einzelnen Projekte werden verwaltet unter
  text_sla_rule_project_info: Nur Projekte mit Projekt-SLA; ohne Auswahl gilt die Regel in allen SLA-Projekten.
  text_sla_rule_priority_info: Höhere Zahl gewinnt bei mehreren passenden Regeln.
  text_sla_confirm_delete_setting: Projekt-SLA löschen? Alle offenen Antwortfristen dieses Projekts werden entfernt.
